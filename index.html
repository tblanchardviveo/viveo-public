<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VIVEO Patrimoine - Programmes immobiliers neufs pour investissement locatif. LMNP, Denormandie, Deficit foncier." />
    <meta name="theme-color" content="#1A2744" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>VIVEO Patrimoine - Immobilier neuf</title>
    <style>
      :root {
        --navy: #1A2744;
        --navy-light: #243352;
        --bronze: #A67C52;
        --bronze-light: #C9A87C;
        --or-doux: #D4AF37;
        --blanc-casse: #FAF9F6;
        --gris-chaud: #E8E4DF;
        --gris-texte: #6B7280;
        --gradient-btn: linear-gradient(135deg, var(--bronze), var(--or-doux));
        --font-heading: 'Playfair Display', Georgia, serif;
        --font-body: 'Raleway', 'Segoe UI', sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: var(--font-body); color: var(--navy); background: var(--blanc-casse); -webkit-font-smoothing: antialiased; }
      a { color: inherit; text-decoration: none; }
      img { max-width: 100%; height: auto; }
      h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
