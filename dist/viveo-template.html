<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[TITRE DE LA PAGE] | VIVEO Patrimoine</title>
  <link rel="stylesheet" href="/viveo-charte.css">
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-inner">
      <div class="eyebrow">
        <div class="eyebrow-line"></div>
        <span class="eyebrow-text">[Sous-titre]</span>
      </div>
      <h1 class="hero-title">[Titre principal]<br><em>[Sous-titre em]</em></h1>
      <p class="hero-intro">[Description introductive]</p>
    </div>
  </section>

  <!-- CONTENU PRINCIPAL -->
  <section class="section section-light">
    <div class="section-inner">
      <div class="eyebrow">
        <div class="eyebrow-line"></div>
        <span class="eyebrow-text">[Section]</span>
      </div>
      <h2>[Titre de section]</h2>
      <p>[Contenu de la section]</p>
    </div>
  </section>

  <!-- SECTION SOMBRE -->
  <section class="section section-dark">
    <div class="section-inner">
      <div class="eyebrow">
        <div class="eyebrow-line"></div>
        <span class="eyebrow-text">[Section]</span>
      </div>
      <h2>[Titre]</h2>
      <p>[Contenu]</p>
    </div>
  </section>

  <!-- CTA -->
  <section class="cta-section">
    <div class="cta-inner">
      <div class="eyebrow">
        <div class="eyebrow-line"></div>
        <span class="eyebrow-text">Votre projet</span>
      </div>
      <h2 class="cta-title">[Question CTA]</h2>
      <p class="cta-subtitle">[Description CTA]</p>
      <a href="/rdv-decouverte" class="cta-btn">Demander mon RDV</a>
    </div>
  </section>

  <script src="/viveo-nav.js"></script>
</body>
</html>
